# Commit style checked by the guard-git hook on every `git commit -m`. Onboarding sets it from the team's real convention; until then the kit default.
# Kit default = Conventional Commits whose subject states the behaviour a user or teammate can observe, e.g.
#   feat(transport): a job can't be completed before its day
#   fix(transport): board fits the screen without sideways scroll
# Sources that may disagree (ask the user which wins, CLAUDE.local.md "When rules conflict"): the team's recent commits,
# commitlint / .gitmessage / CONTRIBUTING, a skill or plugin with its own commit rules, this default.
COMMIT_STYLE_SOURCE="kit default (not confirmed for this project yet)"
SUBJECT_ERE='^(feat|fix|refactor|perf|test|docs|build|ci|chore|style|revert)(\([a-z0-9._/-]+\))?!?: [^ ].{2,70}$'
BAD_SUBJECT_ERE='(^|[^a-z])(wip|fixup|squash!|tmp|typo|oops|misc|update stuff)([^a-z]|$)'
