# This project's work profile. The user picks every value at onboarding (AskUserQuestion), and the AI asks again
# whenever the work changes shape (new branch, overnight run, costly task, first push). Nothing here is fixed for life:
# a project for colleagues at the company and the user's own startup can look completely different.
# AI always works directly in the one checkout: never a worktree, clone or copy of the project (guard-git refuses).
# Several branches = worked in turn (switch, commit, switch back), never at the same time in one repo.
# Careful, never sloppy: an automatic value (BRANCHES=auto, REMOTE=feature, BUDGET=max) is set only
# after the user said yes in a popup that explained it; write "# agreed <date>: <what>" next to it. Every automatic
# run ends with a report (branches, commits, pushed or local, open decisions).
# Push for one run only: the user says "push by yourself" for this run -> `touch $KIT/.ai/run/allow-push` (REMOTE
# becomes feature until the run ends or 24 h pass). Said nothing -> commit only; the user pushes later.

# Who the user is in this repo (grill this hard at onboarding; it changes what may be committed):
#   joined  (default) a team repo the user joined: only project code is committed; the team's rules and AI files in
#           the repo (CLAUDE.md, AGENTS.md, .cursor, copilot ...) come first, then the kit; nothing personal ever.
#   owner   the user created the repo: still only project code plus team-wide rules the user asks for (asked each
#           time); tickets, plans, footprints and personal rules stay in the kit.
REPO_ROLE=joined
# The kit folder's own version control (asked at onboarding):
#   none    plain folder.   local  git in the kit, never a remote (history of footprints, tickets, notes).
#   remote  the user created the repo and wants the kit as its own private repo, kept next to the code repo.
KIT_GIT=

# Resources: how much to spend (model, effort, number of agents, long runs, disk).
#   lean    smallest model/effort that works, one agent at a time, ask before any extra agent or long run.
#   normal  (default) pick per task; ask before many agents at once, long runs or anything costly.
#   max     the user invests here: stronger models, parallel agents, long runs are fine; still say the cost in one line.
# In every level: never make copies of the project "to be safe" and never spend in silence; ask when unsure.
BUDGET=normal

# Branches (local only; remote is REMOTE below).
#   ask   (default) every git switch/checkout/branch creation shows a popup that explains it.
#   auto  the AI may create and switch local branches matching AUTO_BRANCH_ERE by itself (e.g. an overnight run agreed
#         with the user); anything else still asks. A dirty working tree always asks.
BRANCHES=ask
AUTO_BRANCH_ERE='^(feat|fix|chore|refactor|docs|test)/'
# Never commit on these (regex on the branch name).
PROTECTED_BRANCHES='^(main|master|develop|dev|release.*|production|staging)$'

# Remote (push, pull, fetch, remote, gh pr/issue/release/repo ...).
#   ask      (default) every remote command shows a popup: what goes where, who sees it, how to undo.
#   feature  pushing a local feature branch (not protected, no force) needs no popup; every other remote command asks.
#   never    the AI never touches the remote; it gives the user one copy-ready `!` line instead.
# Force-push, --all/--mirror and pushing to protected branches are refused in every level.
REMOTE=ask

# Accounts this project may use: a purpose/group from ~/ai-kit/bin/account list (company, startup, ...).
# Empty = ask at the first task of each session. Flexible: the AI re-asks when it looks wrong (other repo owner, quota).
ACCOUNT_GROUP=

# AI providers this project may use (at most 4). Claude + Codex always come first: lead, planning, review and real code.
# Free or weak ones (agy, gemini) only take tickets marked "Size: tiny" (dispatch <ticket> tiny) and are always reviewed.
# Asked at onboarding; the user can add or remove one any time. Company repos: only what the company approved.
PROVIDERS="claude codex"

# Who plays which role in THIS project. Not fixed: at onboarding look at what this machine really has
# (`~/ai-kit/bin/account plan` / `list`: tools, accounts, plans, quota) and propose a split; e.g. a big Claude plan and a
# small Codex plan -> Claude subagents develop, Codex reviews. Re-ask whenever resources change (new or removed account,
# plan change, one tool keeps running out). Values: claude | codex | agy | gemini (dev/review never a free model).
ROLE_LEAD=claude
ROLE_DEV=codex
ROLE_REVIEW=codex
ROLE_TINY=

# Priority when several projects on this machine run long jobs and share quota:
#   auto (default) the AI decides from ~/ai-kit/bin/projects (deadlines in handoff/tasks, BUDGET, blocked work, how
#        close each run is to done) and says its choice in one line; high / normal / low = the user's fixed choice.
PRIORITY=auto

# Tests (the AI re-asks often either way; the user decides):
#   ask    (default) decide per ticket with the user: `bin/test-scan` shows whether the repo already has tests;
#          repo has tests -> recommend writing them for logic changes; no tests -> recommend skipping (manual checks).
#   tests  write automated tests for logic changes (a tester context, from the ticket); still confirm once per session.
#   manual no automated tests; each ticket carries "Manual checks"; still re-ask once per session in case that changed.
TEST_POLICY=ask
