# This project's work profile. The user picks every value at onboarding (AskUserQuestion), and the AI asks again
# whenever the work changes shape (new branch, overnight run, costly task, first push). Nothing here is fixed for life:
# a project for colleagues at the company and the user's own startup can look completely different.
# AI always works directly in the repo: no clones, no copies, no worktrees of the project unless the user says so.

# Resources: how much to spend (model, effort, number of agents, long runs, disk).
#   lean    smallest model/effort that works, one agent at a time, ask before any extra agent or long run.
#   normal  (default) pick per task; ask before many agents at once, long runs or anything costly.
#   max     the user invests here: stronger models, parallel agents, long runs are fine; still say the cost in one line.
# In every level: never make copies of the project "to be safe" and never spend in silence; ask when unsure.
BUDGET=normal

# Branches (local only; remote is REMOTE below).
#   ask   (default) every git switch/checkout/branch creation shows a popup that explains it.
#   auto  the AI may create and switch local branches matching AUTO_BRANCH_ERE by itself (e.g. an overnight run agreed
#         with the user); anything else still asks. A dirty working tree always asks.
BRANCHES=ask
AUTO_BRANCH_ERE='^(feat|fix|chore|refactor|docs|test)/'
# Never commit on these (regex on the branch name).
PROTECTED_BRANCHES='^(main|master|develop|dev|release.*|production|staging)$'

# Remote (push, pull, fetch, remote, gh pr/issue/release/repo ...).
#   ask      (default) every remote command shows a popup: what goes where, who sees it, how to undo.
#   feature  pushing a local feature branch (not protected, no force) needs no popup; every other remote command asks.
#   never    the AI never touches the remote; it gives the user one copy-ready `!` line instead.
# Force-push, --all/--mirror and pushing to protected branches are refused in every level.
REMOTE=ask

# Tests (the AI re-asks often either way; the user decides):
#   ask    (default) decide per ticket with the user: `bin/test-scan` shows whether the repo already has tests;
#          repo has tests -> recommend writing them for logic changes; no tests -> recommend skipping (manual checks).
#   tests  write automated tests for logic changes (a tester context, from the ticket); still confirm once per session.
#   manual no automated tests; each ticket carries "Manual checks"; still re-ask once per session in case that changed.
TEST_POLICY=ask
