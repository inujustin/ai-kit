# How AI work reaches this project's repo. The user picks it at onboarding; change it any time.
#   direct    Claude edits the user's current feature branch in the team checkout and commits each finished step
#             locally (one ticket = one commit, subject checked against commit-style.conf). Simple to follow in lazygit.
#   worktree  Claude works on ai/* branches in $KIT/worktrees and lands work as a story (.ai/bin/story). Needed for
#             parallel Codex tickets and for risky work you want fully separated.
AI_MODE=direct
# Never commit on these, in any mode (regex on the branch name).
PROTECTED_BRANCHES='^(main|master|develop|dev|release.*|production|staging)$'
# Tests for this project: tests = a tester context writes automated tests from the ticket (risky logic);
# manual = the team checks by hand: the ticket gets a "Manual checks" list instead, and the reviewer confirms it was done.
TEST_POLICY=tests
